name: CI
on: { push: { branches: [main, "arena/**"] }, pull_request: }
permissions: { contents: read }
jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install BISON deps (only project with deps)
        working-directory: projects/bison-brand-book
        run: npm ci --no-audit --no-fund
      - name: Root doctor (back + bison + mega + continuity)
        run: node tools/doctor.mjs --json
